<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width">
    <title>Shopping CArt</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/cart.css">
</head>
<body  >
<!-- Header with back button -->
    <header class="page_header">
        <a href="#" class="back_icon" onclick="history.back()">
            <img src="assets/back_icon.svg" alt="back" width="22" height="22">
        </a>
    </header>
    <h1>Shopping Cart</h1>
    <div class="container">
        <section class ="Cart">
            <div class="cartContainer">
                <div class="card">
                    <h3 class="artistName">Artist name</h3>
                    <div class="productDetails">
                        <div class="iconTrash">
                             <img class="trash" src="assets/trash.svg" alt="trash icon" width="24" height="24">

                        </div>
                        <img class="productImage" src="assets/placeholder.jpg" alt="product image" >
                        <div class="details">
                            <h3 class="productName">Product name</h3>
                            <p class="dim">diemnsions</p>
                        </div>
                        <h3 class =price>00.00sr</h3>
                    </div>
                    <div class="cardDividor"></div>
                    
<div class="productDetails">
                        <div class="iconTrash">
                             <img class="trash" src="assets/trash.svg" alt="trash icon" width="24" height="24">

                        </div>
                        <img class="productImage" src="assets/placeholder.jpg" alt="product image" >
                        <div class="details">
                            <h3 class="productName">Product name</h3>
                            <p class="dim">diemnsions</p>
                        </div>
                        <h3 class =price>00.00sr</h3>
                    </div>


                </div>
                
            </div>
        </section>

         <div class="line"></div>

        <section class ="Summery">
        <h2>Cart Summery</h2>
        <div class="Subprices">
            <p>Shipping fee(3 to 5 business days)</p>
            <p class ="shipping">00.00sr</p>
            <p>TAX (Included)</p>
            <p class="tax">00.00sr</p>
            <p>Subtotal</p>
            <p class="Subtotal">00.00sr</p>
        </div>
        <div class="overallTotal">
            <h3>Total</h3>
            <h3 class="total">00.00sr</h3>
        </div>
        <button type="button" value="checkout" class="checkout-button">Proceed to Checkout</button>

    </section>
    </div>
    
 <script src="js/cart.js"></script>
</body>
</html>
