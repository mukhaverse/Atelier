<!doctype html>
<html>
  <head>
   
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.3.2/aframe/build/aframe-ar.js"></script>
  </head>

  <body style="margin: 0; overflow: hidden;">
    <a-scene
      embedded
      vr-mode-ui="enabled: false"
      renderer="logarithmicDepthBuffer: true;"
      arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: true;">
    

      <a-marker preset="hiro">
         <!--<a-box position="0 0.5 0" color="red"></a-box>  -->
       
       <!--<a-marker type="pattern" url="assets/logo-marker.patt">   -->  
        <a-plane 
          id="ar-image"
          src="ar-test.jpg" 
          height="1" 
          width="1.5"
          position="0 0.5 0"
          rotation="-90 0 0"
        ></a-plane>
      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>

     <script>
        
      function getGoogleDriveDirectUrl(url) {
        if (url.includes('drive.google.com')) {
          const match = url.match(/[?&]id=([^&]+)/);
          if (match) {
            const fileId = match[1];
            
            return `https://lh3.googleusercontent.com/d/${fileId}`;
          }
        }
        return url;
      }

      window.addEventListener('load', () => {
        const urlParams = new URLSearchParams(window.location.search);
        let imageUrl = urlParams.get('img');
        
        if (imageUrl) {
          imageUrl = getGoogleDriveDirectUrl(imageUrl);
          console.log('Loading AR image:', imageUrl);
          
          const arImage = document.getElementById('ar-image');
          arImage.setAttribute('src', imageUrl);
        }
      });

    </script>
    
  </body>
  

</html>
